name: Heart Disease MLOps CI

on:
  push:
    branches: [main, master, "feature/MLOps"]
  pull_request:
    branches: [main, master, "feature/MLOps"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint source and tests
        run: |
          python -m ruff check src tests --select E,F --ignore E402

      - name: Run unit tests
        run: |
          python -m pytest tests -v

      - name: Download dataset
        run: |
          python src/download_data.py

      - name: Run EDA
        run: |
          python src/eda.py

      - name: Train and track models
        run: |
          python src/train_with_mlflow.py

      - name: Verify saved model
        run: |
          python src/verify_model.py

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-mlops-artifacts
          if-no-files-found: warn
          path: |
            models/
            reports/
            data/processed/
            mlruns/
            mlflow.db
            requirements-lock.txt
